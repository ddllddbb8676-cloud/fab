<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>구글 계정 연결 · 팹뿌</title>
  <link rel="stylesheet" href="/account/account.css"><script src="/account/google.js" defer></script>
</head>
<body><main>
  <a class="back" href="/">← 팹뿌로 돌아가기</a>
  <h1 id="heading">구글 계정 연결</h1>
  <p id="intro">구글 계정 하나로 다른 기기에서도 같은 캐릭터로 놀 수 있어요.</p>
  <section id="character" class="card" hidden><small>이 브라우저의 캐릭터</small><strong id="nickname"></strong><span id="record"></span></section>
  <p id="message" role="status" aria-live="polite">연결 상태를 확인하고 있어요.</p>
  <section id="actions" hidden>
    <button id="begin" type="button">구글로 계속하기</button>
    <div id="google-button"></div>
    <div id="external" hidden>
      <p>Safari나 Chrome에서 아래 주소를 열어 구글 인증을 마친 뒤, 이 화면에 코드를 붙여넣어 주세요.</p>
      <input id="url" aria-label="인증 화면 주소" readonly><button id="copy-url" class="secondary" type="button">인증 주소 복사</button>
    </div>
    <details id="manual"><summary>다른 브라우저에서 받은 코드 입력</summary>
      <label for="code">내 일회용 코드</label><input id="code" maxlength="40" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="코드 붙여넣기">
      <button id="check" type="button">캐릭터 확인</button>
    </details>
    <button id="leave" type="button" class="secondary" hidden>이 기기의 원래 캐릭터로 돌아가기</button>
  </section>
  <section id="choice" class="card" hidden><h2 id="choice-title"></h2><p id="choice-text"></p>
    <button id="apply" type="button"></button><button id="cancel" class="secondary" type="button">취소</button>
  </section>
  <section id="transfer" class="card" hidden><label for="issued">내 일회용 코드</label><input id="issued" readonly>
    <button id="copy-code" type="button">코드 복사</button><p>5분 동안 한 번 쓸 수 있어요. 본인이 플레이하던 팹뿌 화면에만 붙여넣어 주세요.</p>
  </section>
  <a class="secondary button" id="return" href="/" hidden>게임으로 돌아가기</a>
  <footer><a href="/account/privacy">구글 연결 정보와 삭제 방법</a></footer>
</main></body></html>

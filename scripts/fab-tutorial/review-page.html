<style>
*{box-sizing:border-box}body{margin:0;background:#092b35;color:#fff;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}main{max-width:620px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom))}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 10px}.format,.note{color:#b9d2cf;font-size:13px;line-height:1.7}.format{white-space:nowrap}video{display:block;width:100%;max-height:72svh;aspect-ratio:9/16;object-fit:contain;border-radius:16px;background:#061e25;border:1px solid #45636c}.listen{color:#dfff68;font-size:14px;margin:14px 0}.actions{display:flex;gap:10px}.actions a{display:flex;align-items:center;justify-content:center;flex:1;padding:13px 8px;min-height:48px;border-radius:13px;font-weight:700;text-decoration:none;font-size:14px;color:#fff;border:1px solid #88aaa7}.actions a:first-child{background:#dfff68;color:#123d46;border:none}details{margin:22px 0}summary{font-weight:700;cursor:pointer;padding:10px 0}.chapters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.chapters button{display:flex;gap:8px;text-align:left;border:1px solid #45636c;background:#143d47;color:#fff;font:inherit;font-size:13px;padding:11px;border-radius:10px;min-height:46px;cursor:pointer}.chapters time{color:#dfff68;font-variant-numeric:tabular-nums}.archive{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}.archive a{color:#c9dddd;font-size:13px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #dfff68;outline-offset:4px}@media(max-width:360px){header{display:block}.format{margin-top:0}}

<main>
  <header><h1>팹뿌 90초 조작법</h1><span class="format">세로 · 한국어 음성</span></header>

    <source src="FAB-controls-90s.mp4" type="video/mp4">

  <div class="actions"><a href="FAB-controls-90s.mp4" download="FAB-controls-90s.mp4">영상 다운로드</a><a href="https://fab.semitoon.com/" target="_blank" rel="noopener">팹뿌 하러 가기 ↗</a></div>

<script>
const video=document.querySelector('#tutorial');
document.querySelectorAll('[data-seek]').forEach(button=>button.addEventListener('click',()=>{
  video.currentTime=Number(button.dataset.seek);
  video.play().catch(()=>{});
  video.scrollIntoView({behavior:'smooth',block:'start'});
}));
</script>

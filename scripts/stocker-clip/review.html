<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#092b35">
<title>팹뿌 · 스토커 풉 출고</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#092b35;color:#f4faf8;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}main{width:min(100%,540px);margin:auto;padding:22px 16px max(30px,env(safe-area-inset-bottom))}h1{font-size:24px;margin:0 0 8px;letter-spacing:-.6px}p{font-size:14px;line-height:1.65;color:#b9d2cf}video{display:block;width:100%;max-height:72svh;aspect-ratio:9/16;object-fit:contain;background:#041b22;border:1px solid #45636c;border-radius:14px}.actions{display:flex;gap:10px;margin-top:14px}.actions>*{flex:1;padding:14px 8px;border:0;border-radius:12px;text-align:center;font:700 15px system-ui;text-decoration:none;cursor:pointer}button{background:#dfff68;color:#123d46}.download{background:#174851;color:#fff;border:1px solid #8caaa8}.back{color:#b9d2cf;font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #dfff68;outline-offset:4px}.credit{font-size:12px;margin:15px 0 22px}#status{min-height:22px;margin:8px 0;font-size:13px}
</style>
<main>
  <h1>스토커에서 풉 꺼내기</h1>
  <p>15초 · 음악 크게 · 나레이션 없음</p>
  <video id="movie" controls playsinline preload="metadata" poster="stocker-poster.jpg" aria-label="스토커에서 풉이 나오고 캐릭터가 꺼내는 15초 영상"><source src="FAB-stocker-OUT-music.mp4?v={{HASH}}" type="video/mp4"></video>
  <div class="actions"><button id="play" type="button">소리 켜고 재생</button><a class="download" href="FAB-stocker-OUT-music.mp4?v={{HASH}}" download="FAB-stocker-OUT-music.mp4">MP4 다운로드</a></div>
  <p id="status" role="status"></p>
  <p class="credit">음악: Scott Joplin — The Entertainer<br>팹뿌 게임 장면 시연 · 1080 × 1920</p>
  <a class="back" href="index.html">← 다른 팹뿌 영상</a>
</main>
<script>
const video=document.getElementById('movie'),status=document.getElementById('status');
document.getElementById('play').onclick=async()=>{video.muted=false;video.volume=1;try{if(video.ended)video.currentTime=0;await video.play();status.textContent='';}catch{status.textContent='영상 안의 재생 버튼을 눌러 주세요.';}};
video.addEventListener('error',()=>{status.textContent='MP4 다운로드 버튼으로 영상을 받아보세요.';});
</script>
</html>
